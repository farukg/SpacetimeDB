# SpacetimeDB Fork CI
# Builds spacetimedb-cli, spacetimedb-standalone, and ReScript SDK,
# publishes to GitLab Generic Package Registry, and creates a git tag.
#
# Trigger: any branch push to GitLab
# Tag format: v2.0.0-fork-<short-sha>
#
# Required CI variables:
#   GITLAB_TAG_TOKEN — token with write_repository scope (for creating tags)
#
# Build file: Containerfile.ci (in repo root)
# Cache strategy: see Containerfile.ci header for layer-by-layer explanation.

stages:
  - build
  - publish

variables:
  PACKAGE_NAME: spacetimedb-release
  MANIFESTS_DIR: /tmp/stdb-manifests-${CI_JOB_ID}

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

build_fork:
  stage: build
  tags: [deploy]
  interruptible: true
  script:
    - |
      echo "=== Building SpacetimeDB fork ==="
      echo "Branch: ${CI_COMMIT_REF_NAME}"
      echo "SHA:    ${CI_COMMIT_SHA}"

    - |
      echo "--- Staging Cargo manifests for dep-cache build context ---"
      mkdir -p "${MANIFESTS_DIR}"
      find . \
        -not -path './.git/*' \
        -not -path './target/*' \
        -name 'Cargo.toml' \
        | while IFS= read -r f; do
            dest="${MANIFESTS_DIR}/${f#./}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done
      cp Cargo.lock "${MANIFESTS_DIR}/Cargo.lock"
      echo "Staged $(find "${MANIFESTS_DIR}" -name 'Cargo.toml' | wc -l) Cargo.toml files + Cargo.lock"

    - |
      echo "--- Building container image ---"
      sudo buildah bud \
        --network=host \
        --build-arg CI_JOB_TOKEN="${CI_JOB_TOKEN}" \
        --build-context manifests="${MANIFESTS_DIR}" \
        --layers \
        -t stdb-build:${CI_COMMIT_SHORT_SHA} \
        -f Containerfile.ci \
        .

    - |
      echo "--- Extracting artifacts ---"
      mkdir -p artifacts
      CTR=$(sudo buildah from stdb-build:${CI_COMMIT_SHORT_SHA})
      MNT=$(sudo buildah mount "$CTR")
      sudo cp "$MNT/spacetimedb-cli" artifacts/
      sudo cp "$MNT/spacetimedb-standalone" artifacts/
      sudo bash -c "cp \"$MNT\"/spacetimedb-rescript-*.tgz artifacts/"
      sudo buildah unmount "$CTR"
      sudo buildah rm "$CTR"

    - |
      echo "--- Artifacts ---"
      ls -lh artifacts/

  artifacts:
    paths:
      - artifacts/
    expire_in: 1 hour

  after_script:
    - sudo buildah rmi -f stdb-build:${CI_COMMIT_SHORT_SHA} 2>/dev/null || true
    - rm -rf /tmp/stdb-manifests-${CI_JOB_ID}

publish_packages:
  stage: publish
  tags: [deploy]
  needs: [build_fork]
  script:
    - TAG="v2.0.0-fork-${CI_COMMIT_SHORT_SHA}"

    - |
      echo "=== Publishing packages ==="
      echo "Tag: ${TAG}"

    - |
      # CI runner resolves gitlab host to backend IP; TLS terminates at Traefik.
      # Use http:// for all API calls from the runner (same fix as cargo-index).
      GITLAB_API_HTTP="${CI_API_V4_URL/https:\/\//http://}"
      for FILE in artifacts/*; do
        FILENAME=$(basename "$FILE")
        echo "Uploading ${FILENAME}..."
        HTTP_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$FILE" \
          "${GITLAB_API_HTTP}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${TAG}/${FILENAME}")
        echo "  ${FILENAME}: HTTP ${HTTP_STATUS}"
        if [ "$HTTP_STATUS" != "201" ] && [ "$HTTP_STATUS" != "200" ]; then
          echo "ERROR: Failed to upload ${FILENAME}"
          exit 1
        fi
      done

    - |
      GITLAB_API_HTTP="${CI_API_V4_URL/https:\/\//http://}"
      echo "Creating tag ${TAG}..."
      curl -sf -X POST \
        --header "PRIVATE-TOKEN: ${GITLAB_TAG_TOKEN}" \
        --data "ref=${CI_COMMIT_SHA}" \
        --data "tag_name=${TAG}" \
        --data "message=CI build ${CI_PIPELINE_ID}" \
        "${GITLAB_API_HTTP}/projects/${CI_PROJECT_ID}/repository/tags"

    - |
      echo ""
      echo "=== Published successfully ==="
      echo "Tag:      ${TAG}"
      echo "Download: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${TAG}/"
