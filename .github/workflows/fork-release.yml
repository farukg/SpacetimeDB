name: Fork Release

# Build and publish release assets when a fork tag is pushed.
# Produces: spacetimedb-cli, spacetimedb-standalone, spacetimedb-rescript-*.tgz

on:
  push:
    tags: ['v*-fork*']

jobs:
  build-rust:
    name: Build Rust binaries (Linux x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dsherret/rust-toolchain-file@v1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fork-release

      - name: Build spacetimedb-cli
        run: cargo build --release -p spacetimedb-cli

      - name: Build spacetimedb-standalone
        run: cargo build --release -p spacetimedb-standalone

      - name: Prepare artifacts
        run: |
          cp target/release/spacetimedb-cli spacetimedb-cli
          cp target/release/spacetimedb-standalone spacetimedb-standalone
          chmod +x spacetimedb-cli spacetimedb-standalone

      - name: Upload Rust artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-binaries
          path: |
            spacetimedb-cli
            spacetimedb-standalone

  build-rescript:
    name: Build ReScript SDK package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: crates/bindings-rescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build ReScript
        run: npx rescript build

      - name: Pack tarball
        run: npm pack

      - name: Upload ReScript artifact
        uses: actions/upload-artifact@v4
        with:
          name: rescript-sdk
          path: crates/bindings-rescript/spacetimedb-rescript-*.tgz

  release:
    name: Create GitHub Release
    needs: [build-rust, build-rescript]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Rust artifacts
        uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: artifacts/

      - name: Download ReScript artifact
        uses: actions/download-artifact@v4
        with:
          name: rescript-sdk
          path: artifacts/

      - name: Make binaries executable
        run: chmod +x artifacts/spacetimedb-cli artifacts/spacetimedb-standalone

      - name: Create release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            artifacts/*
